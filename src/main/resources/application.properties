spring.datasource.url = jdbc:mysql://localhost:3306/adebar
spring.datasource.username = adebar
spring.datasource.password = adebar
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto = update
# the templates load lazy associations while rendering
spring.jpa.open-in-view = true

logging.level.de.naju = TRACE

management.endpoints.web.exposure.include = *

# the error pages display the technical details of the failure
spring.web.error.include-exception = true
spring.web.error.include-message = always
spring.web.error.include-stacktrace = always

logging.file.name = adebar.log
